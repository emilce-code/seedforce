<template>
    <lightning-card>
        <div slot="title" class="brand-header">
            <img src={logoUrl} alt="Seedforce" class="brand-logo" />
            <div>
                <span class="slds-text-heading_small">Seedforce Configuration</span
                ><span class="brand-subtitle">Generator administration</span>
            </div>
        </div>
        <template lwc:if={busy}
            ><lightning-spinner alternative-text="Saving configuration"></lightning-spinner
        ></template>
        <div class="slds-p-around_large">
            <section>
                <h2 class="slds-text-heading_medium">Generator options</h2>
                <p class="slds-text-color_weak slds-m-bottom_medium">
                    Control which plug-in generators appear in the Seedforce field combobox, their labels, and display
                    order.
                </p>
                <div class="table-scroll">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th scope="col">Active</th>
                                <th scope="col">Generator key</th>
                                <th scope="col">Display label</th>
                                <th scope="col">Order</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={generators} for:item="generator"
                                ><tr key={generator.key}>
                                    <td>
                                        <lightning-input
                                            type="checkbox"
                                            variant="label-hidden"
                                            label="Active"
                                            checked={generator.active}
                                            data-key={generator.key}
                                            data-property="active"
                                            onchange={updateGenerator}
                                        ></lightning-input>
                                    </td>
                                    <td><code>{generator.key}</code></td>
                                    <td>
                                        <lightning-input
                                            variant="label-hidden"
                                            label="Display label"
                                            value={generator.label}
                                            data-key={generator.key}
                                            data-property="label"
                                            onchange={updateGenerator}
                                            required
                                        ></lightning-input>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label="Sort order"
                                            value={generator.sortOrder}
                                            min="0"
                                            max="9999"
                                            data-key={generator.key}
                                            data-property="sortOrder"
                                            onchange={updateGenerator}
                                        ></lightning-input>
                                    </td></tr
                            ></template>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="slds-m-top_x-large">
                <div class="section-heading">
                    <div>
                        <h2 class="slds-text-heading_medium">Recommendation rules</h2>
                        <p class="slds-text-color_weak">
                            Lower priority numbers run first. Patterns support leading or trailing * wildcards.
                        </p>
                    </div>
                    <lightning-button label="Add Rule" icon-name="utility:add" onclick={addRule}></lightning-button>
                </div>
                <template lwc:if={hasRules}
                    ><div class="table-scroll slds-m-top_medium">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Active</th>
                                    <th>Name</th>
                                    <th>Field type</th>
                                    <th>Field name pattern</th>
                                    <th>Generator</th>
                                    <th>Priority</th>
                                    <th>Min length</th>
                                    <th>Max length</th>
                                    <th><span class="slds-assistive-text">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={rules} for:item="rule"
                                    ><tr key={rule.localKey}>
                                        <td>
                                            <lightning-input
                                                type="checkbox"
                                                variant="label-hidden"
                                                label="Active"
                                                checked={rule.active}
                                                data-key={rule.localKey}
                                                data-property="active"
                                                onchange={updateRule}
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input
                                                variant="label-hidden"
                                                label="Rule name"
                                                value={rule.name}
                                                data-key={rule.localKey}
                                                data-property="name"
                                                onchange={updateRule}
                                                required
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-combobox
                                                variant="label-hidden"
                                                label="Field type"
                                                value={rule.fieldType}
                                                options={fieldTypeOptions}
                                                data-key={rule.localKey}
                                                data-property="fieldType"
                                                onchange={updateRule}
                                            ></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-input
                                                variant="label-hidden"
                                                label="Field name pattern"
                                                value={rule.fieldNamePattern}
                                                placeholder="e.g. *Email*"
                                                data-key={rule.localKey}
                                                data-property="fieldNamePattern"
                                                onchange={updateRule}
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-combobox
                                                variant="label-hidden"
                                                label="Generator"
                                                value={rule.generatorKey}
                                                options={generatorOptions}
                                                data-key={rule.localKey}
                                                data-property="generatorKey"
                                                onchange={updateRule}
                                            ></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                label="Priority"
                                                value={rule.priority}
                                                min="0"
                                                max="9999"
                                                data-key={rule.localKey}
                                                data-property="priority"
                                                onchange={updateRule}
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                label="Minimum length"
                                                value={rule.minimumLength}
                                                min="0"
                                                data-key={rule.localKey}
                                                data-property="minimumLength"
                                                onchange={updateRule}
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                label="Maximum length"
                                                value={rule.maximumLength}
                                                min="0"
                                                data-key={rule.localKey}
                                                data-property="maximumLength"
                                                onchange={updateRule}
                                            ></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Remove rule"
                                                title="Remove rule"
                                                data-key={rule.localKey}
                                                onclick={removeRule}
                                            ></lightning-button-icon>
                                        </td></tr
                                ></template>
                            </tbody>
                        </table></div
                ></template>
                <template lwc:else
                    ><div class="empty-state slds-m-top_medium">
                        No custom rules. Built-in Seedforce recommendations remain active.
                    </div></template
                >
            </section>
            <div class="actions">
                <lightning-button label="Reload" onclick={load}></lightning-button
                ><lightning-button
                    variant="brand"
                    label="Save Configuration"
                    onclick={save}
                    disabled={busy}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
